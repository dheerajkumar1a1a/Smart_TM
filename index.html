<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Management System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f4f6f8; color: #222; transition: 0.3s; }
        .container { width: 90%; max-width: 1100px; margin: 30px auto; }
        h1 { margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 25px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .dark-btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; background: #333; color: white; }
        .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h3 { color: #666; font-size: 14px; margin-bottom: 8px; }
        .card p { font-size: 28px; font-weight: bold; }
        .task-form { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .task-form h2 { margin-bottom: 15px; }
        .form-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; }
        input, select { padding: 12px; border: 1px solid #ccc; border-radius: 6px; width: 100%; }
        .add-btn { margin-top: 15px; padding: 12px 20px; border: none; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
        .add-btn:hover { background: #1d4ed8; }
        .ai-box { background: #eef2ff; padding: 20px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid #6366f1; }
        .ai-box h2 { margin-bottom: 10px; }
        .ai-result { margin-top: 10px; color: #333; }
        .ai-btn { margin-top: 10px; padding: 10px 15px; border: none; border-radius: 6px; background: #6366f1; color: white; cursor: pointer; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; }
        .task.completed { opacity: 0.6; }
        .task.completed .task-title { text-decoration: line-through; }
        .task-info { flex: 1; }
        .task-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .task-details { font-size: 13px; color: #666; }
        .priority { display: inline-block; padding: 4px 8px; border-radius: 5px; font-size: 12px; margin-right: 5px; }
        .low { background: #dcfce7; color: #166534; }
        .medium { background: #fef3c7; color: #92400e; }
        .high { background: #fee2e2; color: #991b1b; }
        .task-buttons { display: flex; gap: 5px; }
        .task-buttons button { border: none; padding: 8px 10px; border-radius: 5px; cursor: pointer; }
        .complete-btn { background: #22c55e; color: white; }
        .edit-btn { background: #f59e0b; color: white; }
        .delete-btn { background: #ef4444; color: white; }
        body.dark { background: #111827; color: white; }
        body.dark .card, body.dark .task, body.dark .task-form { background: #1f2937; color: white; }
        body.dark .subtitle, body.dark .task-details, body.dark .card h3 { color: #aaa; }
        body.dark input, body.dark select { background: #374151; color: white; border-color: #555; }
        body.dark .ai-box { background: #312e81; }
        body.dark .ai-result { color: white; }
        @media (max-width: 700px) {
            .dashboard { grid-template-columns: repeat(2, 1fr); }
            .form-row { grid-template-columns: 1fr; }
            .task { flex-direction: column; align-items: flex-start; gap: 15px; }
            .controls { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div>
            <h1>Smart Task Management System</h1>
            <p class="subtitle">Organize, manage and track your daily tasks</p>
        </div>
        <button class="dark-btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </div>

    <div class="dashboard">
        <div class="card"><h3>Total Tasks</h3><p id="totalTasks">0</p></div>
        <div class="card"><h3>Pending</h3><p id="pendingTasks">0</p></div>
        <div class="card"><h3>Completed</h3><p id="completedTasks">0</p></div>
        <div class="card"><h3>High Priority</h3><p id="highTasks">0</p></div>
    </div>

    <div class="task-form">
        <h2>Add New Task</h2>
        <div class="form-row">
            <input type="text" id="taskInput" placeholder="Enter task name">
            <select id="priorityInput">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>
            <select id="categoryInput">
                <option value="Work">Work</option>
                <option value="Study">Study</option>
                <option value="Personal">Personal</option>
                <option value="Other">Other</option>
            </select>
            <input type="date" id="dateInput">
        </div>
        <button class="add-btn" onclick="addTask()">+ Add Task</button>
    </div>

    <div class="ai-box">
        <h2>🤖 AI Task Assistant</h2>
        <p>Get a smart suggestion about which task you should work on first.</p>
        <button class="ai-btn" onclick="aiSuggestion()">Generate AI Suggestion</button>
        <div id="aiResult" class="ai-result"></div>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="🔍 Search tasks..." onkeyup="displayTasks()">
        <select id="filterInput" onchange="displayTasks()">
            <option value="All">All Tasks</option>
            <option value="Pending">Pending</option>
            <option value="Completed">Completed</option>
            <option value="High">High Priority</option>
        </select>
    </div>

    <div id="taskList" class="task-list"></div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function saveTasks() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
}

function addTask() {
    const taskName = document.getElementById("taskInput").value;
    const priority = document.getElementById("priorityInput").value;
    const category = document.getElementById("categoryInput").value;
    const dueDate = document.getElementById("dateInput").value;

    if (taskName.trim() === "") {
        alert("Please enter a task.");
        return;
    }

    const task = {
        id: Date.now(),
        name: taskName,
        priority: priority,
        category: category,
        dueDate: dueDate,
        completed: false
    };

    tasks.push(task);
    saveTasks();

    document.getElementById("taskInput").value = "";
    document.getElementById("dateInput").value = "";

    displayTasks();
}

function displayTasks() {
    const taskList = document.getElementById("taskList");
    const search = document.getElementById("searchInput").value.toLowerCase();
    const filter = document.getElementById("filterInput").value;

    taskList.innerHTML = "";

    const filteredTasks = tasks.filter(task => {
        const matchesSearch = task.name.toLowerCase().includes(search);
        let matchesFilter = true;

        if (filter === "Pending") matchesFilter = task.completed === false;
        if (filter === "Completed") matchesFilter = task.completed === true;
        if (filter === "High") matchesFilter = task.priority === "High";

        return matchesSearch && matchesFilter;
    });

    filteredTasks.forEach(task => {
        const taskElement = document.createElement("div");
        taskElement.className = "task";
        if (task.completed) taskElement.classList.add("completed");

        taskElement.innerHTML = `
            <div class="task-info">
                <div class="task-title">${escapeHtml(task.name)}</div>
                <div class="task-details">
                    <span class="priority ${task.priority.toLowerCase()}">${task.priority}</span>
                    Category: ${escapeHtml(task.category)}
                    |
                    Due: ${task.dueDate || "No date"}
                </div>
            </div>
            <div class="task-buttons">
                <button class="complete-btn" onclick="toggleComplete(${task.id})">
                    ${task.completed ? "Undo" : "Complete"}
                </button>
                <button class="edit-btn" onclick="editTask(${task.id})">Edit</button>
                <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
            </div>
        `;
        taskList.appendChild(taskElement);
    });

    updateDashboard();
}

function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value;
    return div.innerHTML;
}

function toggleComplete(id) {
    const task = tasks.find(task => task.id === id);
    if (task) task.completed = !task.completed;
    saveTasks();
    displayTasks();
}

function deleteTask(id) {
    if (!confirm("Are you sure you want to delete this task?")) return;
    tasks = tasks.filter(task => task.id !== id);
    saveTasks();
    displayTasks();
}

function editTask(id) {
    const task = tasks.find(task => task.id === id);
    if (!task) return;

    const newName = prompt("Enter new task name:", task.name);
    if (newName !== null && newName.trim() !== "") {
        task.name = newName.trim();
    }

    const newPriority = prompt("Priority: Low, Medium or High", task.priority);
    if (newPriority === "Low" || newPriority === "Medium" || newPriority === "High") {
        task.priority = newPriority;
    }

    saveTasks();
    displayTasks();
}

function updateDashboard() {
    const total = tasks.length;
    const completed = tasks.filter(task => task.completed).length;
    const pending = total - completed;
    const high = tasks.filter(task => task.priority === "High" && !task.completed).length;

    document.getElementById("totalTasks").textContent = total;
    document.getElementById("pendingTasks").textContent = pending;
    document.getElementById("completedTasks").textContent = completed;
    document.getElementById("highTasks").textContent = high;
}

function aiSuggestion() {
    const result = document.getElementById("aiResult");
    const pendingTasks = tasks.filter(task => !task.completed);

    if (pendingTasks.length === 0) {
        result.innerHTML = "🎉 You have no pending tasks! Great job.";
        return;
    }

    pendingTasks.sort((a, b) => {
        const priorityScore = { High: 3, Medium: 2, Low: 1 };
        const priorityDifference = priorityScore[b.priority] - priorityScore[a.priority];

        if (priorityDifference !== 0) return priorityDifference;

        if (a.dueDate && b.dueDate) return new Date(a.dueDate) - new Date(b.dueDate);
        if (a.dueDate) return -1;
        if (b.dueDate) return 1;
        return 0;
    });

    const bestTask = pendingTasks[0];

    result.innerHTML = `
        <strong>💡 Suggested Task:</strong> ${escapeHtml(bestTask.name)}
        <br><br>
        <strong>Reason:</strong> This task has <strong>${bestTask.priority}</strong> priority
        ${bestTask.dueDate
            ? `and is due on ${bestTask.dueDate}.`
            : "and should be considered next based on your task list."
        }
    `;
}

function toggleDarkMode() {
    document.body.classList.toggle("dark");
    const darkMode = document.body.classList.contains("dark");
    localStorage.setItem("darkMode", darkMode);
}

if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark");
}

displayTasks();
</script>
</body>
</html>
